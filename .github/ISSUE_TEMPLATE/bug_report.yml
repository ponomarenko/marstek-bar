name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Battery model and firmware version
      placeholder: Venus E 3.0, firmware 151
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the error text shown in the app, if any.
    validations:
      required: true
